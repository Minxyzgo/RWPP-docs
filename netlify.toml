[build]
  command = "pip install -r requirements.txt && python scripts/generate_api.py && mkdocs build --clean"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

# 目录与搜索响应是构建产物：允许跨域读取，并让客户端缓存五分钟。
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/v1/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 目录与端点由 catalog 函数从 R2 的运行时 registry 渲染。force 让规则覆盖
# 同名的构建期静态快照，R2 不可用时函数会自行返回该快照。
[[redirects]]
  from = "/api/index.json"
  to = "/.netlify/functions/catalog?kind=index"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/index.json"
  to = "/.netlify/functions/catalog?kind=index"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/search.json"
  to = "/.netlify/functions/catalog?kind=search"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/manifest.json"
  to = "/.netlify/functions/catalog?kind=manifest"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/extensions/:id"
  to = "/.netlify/functions/catalog?kind=extension&id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/extensions/:id"
  to = "/.netlify/functions/catalog?kind=extension&id=:id"
  status = 200
  force = true

# 服务端搜索由 Netlify Function 提供，查询参数在重写时保留。
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

# 安装包与宿主归档不进入站点仓库，指向 GitHub Release 的最新同名资产。
# 302 让浏览器直接访问 GitHub CDN，不经过 Netlify 转发大文件。
[[redirects]]
  from = "/downloads/rwml-setup.exe"
  to = "https://github.com/RWPP-Team/RWML/releases/latest/download/rwml-setup.exe"
  status = 302
  force = true

[[redirects]]
  from = "/downloads/rwml-setup.msi"
  to = "https://github.com/RWPP-Team/RWML/releases/latest/download/rwml-setup.msi"
  status = 302
  force = true

[[redirects]]
  from = "/downloads/game-lib.jar"
  to = "https://github.com/RWPP-Team/RWML/releases/latest/download/game-lib.jar"
  status = 302
  force = true

# 安装包仍由发行版提供，扩展归档走带鉴权的下载入口。
[[redirects]]
  from = "/downloads/github/:file"
  to = "https://github.com/RWPP-Team/RWML/releases/latest/download/:file"
  status = 302
  force = true

# 归档入口：校验目录令牌与请求频率后跳转到归档地址。
[[redirects]]
  from = "/api/archives/:file"
  to = "/.netlify/functions/archive-download?file=:file"
  status = 200
  force = true

# 分发决策不缓存，配额状态变化后立即生效。
[[headers]]
  for = "/api/archives/*"
  [headers.values]
    Cache-Control = "no-store"

